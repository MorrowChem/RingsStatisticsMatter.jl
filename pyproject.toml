[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rings-statistics-matter"
version = "0.2.0"
description = "Primitive ring statistics for large atomistic models"
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joe Morrow" }]
requires-python = ">=3.10"
dependencies = ["ase", "numpy", "scipy", "vesin", "juliacall"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
]

[project.urls]
Repository = "https://github.com/MorrowChem/RingsStatisticsMatter"

[dependency-groups]
dev = ["pytest", "ruff"]

[tool.hatch.build.targets.wheel]
packages = ["rings_statistics_matter"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

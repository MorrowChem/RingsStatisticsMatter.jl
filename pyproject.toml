[build-system]
requires = ["maturin>=1.7,<2"]
build-backend = "maturin"

[project]
name = "rings-statistics-matter"
version = "0.2.0"
description = "Primitive ring statistics for large atomistic models"
readme = "README.rst"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joe Morrow" }]
requires-python = ">=3.10"
dependencies = ["ase", "numpy", "scipy", "vesin"]
classifiers = [
  "Programming Language :: Rust",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
]

[project.urls]
Repository = "https://github.com/MorrowChem/RingsStatisticsMatter"

[project.optional-dependencies]
julia = ["juliacall"]

[dependency-groups]
dev = ["pytest", "ruff", "juliacall"]

[tool.maturin]
module-name = "rings_statistics_matter._kernel"
include = [{ path = "rings_statistics_matter/rings.jl", format = ["sdist", "wheel"] }]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

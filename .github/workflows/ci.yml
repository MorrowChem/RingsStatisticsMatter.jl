name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: cargo fmt --check
      - run: cargo clippy --release -- -D warnings
      - run: uv sync
      - run: uv run ruff check rings_statistics_matter tests
      - run: uv run pytest
        env:
          JULIA_NUM_THREADS: auto
